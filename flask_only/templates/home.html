{% extends 'base.html' %}
{% block content %}
<div class="page home-page">
    <header class="home-header">
        <h1 class="home-title">Welcome to Rewindify</h1>
        <p class="home-subtitle styled-subtitle">
            Turn back time and relive the hits!<br />
            <span class="subtitle-detail">Generate a Spotify playlist based on any Billboard chart date</span>
        </p>
        <div class="input-section">
            <input type="date" id="date" class="input-field" max="{{ max_date }}" />
            <input type="number" id="track-count" class="input-field" placeholder="Number of tracks" min="1" max="100" />
            <div id="validation-warning" class="validation-warning" style="display:none;">Track count must be 100 or less.</div>
            <input type="text" id="playlist-title" class="input-field" placeholder="Playlist Title" style="display:none;" />
            <a id="login-link" class="spotify-login-button" href="#" style="display:none;">Log in with Spotify</a>
            <button id="generate-btn" class="generate-button">Generate</button>
            <button id="create-btn" class="spotify-button" style="display:none;">Create Spotify Playlist</button>
            <div id="playlist-success" class="playlist-success" style="display:none;"></div>
        </div>
    </header>
    <div id="song-table-container"></div>
    <footer class="about-footer">
        <div>Made by <a class="about-footer-link" href="https://github.com/ajs2583">Andrew Sliva</a></div>
        <div class="footer-links">
            <a class="about-footer-link" href="{{ url_for('home') }}">Home</a> |
            <a class="about-footer-link" href="{{ url_for('about') }}">About</a> |
            <a class="about-footer-link" href="{{ url_for('privacy_policy') }}">Privacy Policy</a> |
            <a class="about-footer-link" href="{{ url_for('contact') }}">Contact</a>
        </div>
    </footer>
</div>
{% endblock %}
